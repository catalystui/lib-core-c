name: Compile

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: C90 / C++98 (x86)
            c: 90
            cpp: 98
            arch: x86
            flags: -m32
          - name: C99 / C++11 (x64)
            c: 99
            cpp: 11
            arch: x64
            flags: -m64

    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install 'cmake>=4.3,<5'
          if ('${{ matrix.arch }}' -eq 'x86') {
            sudo apt-get update
            sudo apt-get install -y gcc-multilib g++-multilib
          }

      - name: Configure
        run: |
          cmake -S . -B target/ci -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ `
            -DCMAKE_C_STANDARD=${{ matrix.c }} -DCMAKE_CXX_STANDARD=${{ matrix.cpp }} `
            -DCMAKE_C_STANDARD_REQUIRED=ON -DCMAKE_CXX_STANDARD_REQUIRED=ON `
            -DCMAKE_C_EXTENSIONS=OFF -DCMAKE_CXX_EXTENSIONS=OFF `
            -DCMAKE_C_FLAGS=${{ matrix.flags }} -DCMAKE_CXX_FLAGS=${{ matrix.flags }} `
            -DTARGET_VENDOR=linux -DTARGET_SYSTEM=linux -DTARGET_ARCHITECTURE=${{ matrix.arch }}

      - name: Compile libraries
        run: cmake --build target/ci --parallel --target cattelib_static cattelib_shared catoolib_static catoolib_shared

      - name: Verify library artifacts and ABI names
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $header = Get-Content target/ci/generated/cmakecfg.h -Raw
          $major = [regex]::Match($header, '#define METADATA_VERSION_MAJOR (\d+)').Groups[1].Value
          $minor = [regex]::Match($header, '#define METADATA_VERSION_MINOR (\d+)').Groups[1].Value
          $patch = [regex]::Match($header, '#define METADATA_VERSION_PATCH (\d+)').Groups[1].Value
          $abi = "$major.$minor"
          $version = "$abi.$patch"
          $output = 'build/linux/linux/${{ matrix.arch }}/release'
          foreach ($name in 'catte','catmm','catrl','catoo') {
            $base = "lib$name"
            $linker = "$base.so"
            $soname = "$linker.$abi"
            $binary = "$linker.$version"
            if (!(Test-Path "$output/lib/$base.a" -PathType Leaf) -or !(Test-Path "$output/$binary" -PathType Leaf)) {
              throw "Missing static or shared artifact for $name"
            }
            if ((readlink "$output/lib/$linker") -ne "../$soname" -or (readlink "$output/$soname") -ne $binary) {
              throw "Incorrect symbolic links for $name"
            }
            if (!(readelf -d "$output/$binary" | Select-String -SimpleMatch "[$soname]")) {
              throw "Incorrect embedded SONAME for $name"
            }
            if (!(readelf -d "$output/$binary" | Select-String -SimpleMatch '[$ORIGIN]')) {
              throw "Incorrect runtime search path for $name"
            }
            if (Test-Path "$output/$linker") {
              throw "Unexpected top-level development linker alias for $name"
            }
          }

      - name: Run text encoding tests
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cmake --build target/ci --parallel --target test_cattelib
          $output = 'build/linux/linux/${{ matrix.arch }}/release'
          foreach ($name in 'test_cattelib') {
            if (!(Test-Path "$output/$name" -PathType Leaf)) {
              throw "Missing top-level test executable $name"
            }
          }
          & "$output/test_cattelib"

      - name: Compile and test object-oriented composites
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cmake --build target/ci --parallel --target catoolib_shared test_catoolib perf_catoolib test_catrllib
          $output = 'build/linux/linux/${{ matrix.arch }}/release'
          & "$output/test_catoolib"
          & "$output/test_catrllib"

      - name: Compile and test CATTRLIB
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cmake --build target/ci --parallel --target cattrlib_shared test_cattrlib perf_cattrlib
          $output = 'build/linux/linux/${{ matrix.arch }}/release'
          & "$output/test_cattrlib"
          # Bound benchmark execution so a synchronization regression cannot hang CI.
          timeout 120s "$output/perf_cattrlib"

      - name: Verify relocatable shared-library runtime
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $output = 'build/linux/linux/${{ matrix.arch }}/release'
          g++ ${{ matrix.flags }} -std=c++${{ matrix.cpp }} -Iinclude -Itarget/ci/generated test/test_cattelib.cpp "-L$output/lib" -lcatte '-Wl,-rpath,$ORIGIN' -o "$output/test_cattelib_dynamic"
          g++ ${{ matrix.flags }} -std=c++${{ matrix.cpp }} -Iinclude -Itarget/ci/generated test/test_catoolib.cpp "-L$output/lib" -lcatoo -lcatrl -lcatmm '-Wl,-rpath,$ORIGIN' -o "$output/test_catoolib_dynamic"
          # Exercise actual C callbacks and C consumers, not just C header syntax.
          @'
          #include "catoolib.h"

          static CATALYST_RESULT read_member(CATOOLIB_OBJECT* object, CATMMLIB_POINTER arguments, CATMMLIB_POINTERW output) {
              CATALYST_RESULT result = { CATALYST_STATUS_CODE_SUCCESS, 0xA0, 1, 0 };
              CATOOLIB_MEMBER* member = catoo_object_get(object, arguments);
              if (member == 0) {
                  result.status = CATALYST_STATUS_CODE_ERROR_NOT_FOUND;
                  result.operation = 2;
                  return result;
              }
              catoo_member_get(member, output);
              return result;
          }

          int main(void) {
              CATOOLIB_OBJECT definition, instance;
              CATOOLIB_CLASS class_;
              CATOOLIB_FIELD field;
              CATOOLIB_METHOD method = read_member;
              CATOOLIB_MEMBER* member;
              CATALYST_RESULT result;
              CATALYST_BYTE key = 1, method_key = 2, value = 42, output[2];
              catoo_object_init(&definition, 1);
              if (!CATALYST_STATUS_CODE_IS_SUCCESS(catoo_object_expand(&definition, 2).status)) return 1;
              if (!CATALYST_STATUS_CODE_IS_SUCCESS(catoo_object_add(&definition, &key, &value, 1).status)) return 2;
              if (!CATALYST_STATUS_CODE_IS_SUCCESS(catoo_object_add(&definition, &method_key, &method, (CATALYST_NUINT) sizeof(method)).status)) return 3;
              if (!CATALYST_STATUS_CODE_IS_SUCCESS(catoo_class_init(&class_, &definition).status)) return 4;
              if (!CATALYST_STATUS_CODE_IS_SUCCESS(catoo_class_create(&class_, &instance).status)) return 5;
              if (!CATALYST_STATUS_CODE_IS_SUCCESS(catoo_class_free(&class_).status)) return 6;
              if (!CATALYST_STATUS_CODE_IS_SUCCESS(catoo_object_free(&definition).status)) return 7;
              member = catoo_object_get(&instance, &key);
              if (member == 0) return 8;
              result = catoo_member_resize(member, 2);
              if (result.status != CATALYST_STATUS_CODE_SUCCESS || result.context != 0x1E || result.operation != 4 || result.detail != 0) return 9;
              if (!catoo_field_init(&field, &instance, &method_key)) return 10;
              result = catoo_method_invoke(&field, &key, output);
              if (result.status != CATALYST_STATUS_CODE_SUCCESS || result.context != 0x11 || result.operation != 1 || result.detail != 0) return 11;
              if (output[0] != value || output[1] != 0) return 12;
              if (!CATALYST_STATUS_CODE_IS_SUCCESS(catoo_object_free(&instance).status)) return 13;
              return 0;
          }
          '@ | gcc ${{ matrix.flags }} -std=c${{ matrix.c }} -pedantic-errors -Iinclude -Itarget/ci/generated -x c -c -o target/ci/catoolib-c-client.o -
          gcc ${{ matrix.flags }} target/ci/catoolib-c-client.o "-L$output/lib" -lcatoo -lcatrl -lcatmm '-Wl,-rpath,$ORIGIN' -o "$output/test_catoolib_c_dynamic"
          $runtime = 'target/ci/runtime-check'
          New-Item -ItemType Directory -Path $runtime -Force | Out-Null
          Get-ChildItem "$output/lib*.so.*" | ForEach-Object { /bin/cp -P $_.FullName "$runtime/" }
          Copy-Item "$output/test_cattelib_dynamic" "$runtime/"
          Copy-Item "$output/test_catoolib_dynamic" "$runtime/"
          Copy-Item "$output/test_catoolib_c_dynamic" "$runtime/"
          & "$runtime/test_cattelib_dynamic"
          & "$runtime/test_catoolib_dynamic"
          & "$runtime/test_catoolib_c_dynamic"

      - name: Compile public C headers
        run: |
          @'
          #include "catalyst.h"
          #include "cattelib.h"
          #include "catoolib.h"
          #include "cattrlib.h"
          '@ | gcc ${{ matrix.flags }} -std=c${{ matrix.c }} -pedantic-errors -Iinclude -Itarget/ci/generated -x c -c -o target/ci/headers-c.o -

      - name: Compile public C++ headers
        run: |
          @'
          #include "catalyst.hpp"
          #include "cattelib.hpp"
          #include "catoolib.hpp"
          #include "cattrlib.hpp"
          '@ | g++ ${{ matrix.flags }} -std=c++${{ matrix.cpp }} -pedantic-errors -Iinclude -Itarget/ci/generated -x c++ -c -o target/ci/headers-cpp.o -

      - name: Verify optional-width fallback and 8-bit target compilation
        if: matrix.arch == 'x64'
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $fallback = 'target/ci/fallback'
          $avr = 'target/ci/avr'
          New-Item -ItemType Directory -Path $fallback,$avr -Force | Out-Null
          @'
          #define TARGET_STDC_VERSION 0
          #define TARGET_SIZEOF_VOID_P 8
          #define TARGET_SIZEOF_SHORT 0
          #define TARGET_SIZEOF_INT 0
          #define TARGET_SIZEOF_LONG 8
          #define TARGET_SIZEOF_FLOAT 0
          #define TARGET_SIZEOF_DOUBLE 0
          #define TARGET_IEC559_SINGLE 0
          #define TARGET_IEC559_DOUBLE 0
          '@ | Set-Content "$fallback/cmakecfg.h"
          @'
          #include "catalyst.h"
          #if CATALYST_SUPPORTS_16BIT || CATALYST_SUPPORTS_32BIT || !CATALYST_SUPPORTS_64BIT
          #error "Fallback must provide only bytes and the required pointer-width representation."
          #endif
          '@ | gcc -std=c90 -pedantic-errors -Iinclude "-I$fallback" -x c -c -o "$fallback/headers.o" -
          g++ -O3 -std=c++98 -pedantic-errors -Iinclude "-I$fallback" src/cattelib.cpp test/test_cattelib.cpp -o "$fallback/test"
          & "./$fallback/test"

          # Exercise the intermediate-width algorithms on the same host.
          (Get-Content "$fallback/cmakecfg.h" -Raw).Replace('TARGET_SIZEOF_SHORT 0','TARGET_SIZEOF_SHORT 2') | Set-Content "$fallback/cmakecfg.h"
          @'
          #include "catalyst.h"
          #if !CATALYST_SUPPORTS_16BIT || CATALYST_SUPPORTS_32BIT || !CATALYST_SUPPORTS_64BIT
          #error "Expected 16-bit intermediate arithmetic with the required pointer-width representation."
          #endif
          '@ | gcc -std=c90 -pedantic-errors -Iinclude "-I$fallback" -x c -c -o "$fallback/headers16.o" -
          g++ -O3 -std=c++98 -pedantic-errors -Iinclude "-I$fallback" src/cattelib.cpp test/test_cattelib.cpp -o "$fallback/test16"
          & "./$fallback/test16"
          (Get-Content "$fallback/cmakecfg.h" -Raw).Replace('TARGET_SIZEOF_SHORT 2','TARGET_SIZEOF_SHORT 0') | Set-Content "$fallback/cmakecfg.h"

          # The numeric header can also expose only mandatory byte types.
          (Get-Content "$fallback/cmakecfg.h" -Raw).Replace('TARGET_SIZEOF_LONG 8','TARGET_SIZEOF_LONG 0') | Set-Content "$fallback/cmakecfg.h"
          @'
          #include "catalyst.c90.h"
          #if CATALYST_SUPPORTS_16BIT || CATALYST_SUPPORTS_32BIT || CATALYST_SUPPORTS_64BIT
          #error "Unexpected optional integer representation."
          #endif
          typedef char byte_check[(sizeof(CATALYST_BYTE) == 1 && CATALYST_SBYTE_MIN == -128) ? 1 : -1];
          '@ | gcc -std=c90 -pedantic-errors -Iinclude "-I$fallback" -x c -c -o "$fallback/byte-only.o" -
          (Get-Content "$fallback/cmakecfg.h" -Raw).Replace('TARGET_SIZEOF_LONG 0','TARGET_SIZEOF_LONG 8') | Set-Content "$fallback/cmakecfg.h"

          # Compile the portable library for a real 8-bit AVR instruction set.
          @'
          #define TARGET_STDC_VERSION 0
          #define TARGET_SIZEOF_VOID_P 2
          #define TARGET_ADDRESS_KIND 1
          #define TARGET_SIZEOF_ADDRESS 2
          #define TARGET_SIZEOF_SHORT 2
          #define TARGET_SIZEOF_INT 2
          #define TARGET_SIZEOF_LONG 0
          #define TARGET_SIZEOF_FLOAT 0
          #define TARGET_SIZEOF_DOUBLE 0
          #define TARGET_IEC559_SINGLE 0
          #define TARGET_IEC559_DOUBLE 0
          '@ | Set-Content "$avr/cmakecfg.h"
          @'
          #include "catalyst.h"
          #include "cattelib.h"
          #include "catoolib.h"
          #if !CATALYST_SUPPORTS_16BIT || CATALYST_SUPPORTS_32BIT || CATALYST_SUPPORTS_64BIT
          #error "AVR intermediate configuration must expose 16-bit but not 32-bit or 64-bit types."
          #endif
          '@ | clang -target avr -mmcu=atmega328p -ffreestanding -std=c90 -pedantic-errors -Iinclude "-I$avr" -x c -c -o "$avr/headers.o" -
          clang++ -target avr -mmcu=atmega328p -ffreestanding -std=c++98 -pedantic-errors -Os -Iinclude "-I$avr" -c src/cattelib.cpp -o "$avr/cattelib-fallback.o"
          clang++ -target avr -mmcu=atmega328p -ffreestanding -std=c++98 -pedantic-errors -Os -Iinclude "-I$avr" -c src/catrllib.cpp -o "$avr/catrllib-fallback.o"
          clang++ -target avr -mmcu=atmega328p -ffreestanding -std=c++98 -pedantic-errors -Os -Iinclude "-I$avr" -c src/catoolib.cpp -o "$avr/catoolib-fallback.o"
          # Enable the AVR compiler's exact-width C99 integer types as well.
          (Get-Content "$avr/cmakecfg.h" -Raw).Replace('TARGET_STDC_VERSION 0','TARGET_STDC_VERSION 199901L') | Set-Content "$avr/cmakecfg.h"
          clang++ -target avr -mmcu=atmega328p -ffreestanding -std=c++11 -pedantic-errors -Os -Iinclude "-I$avr" -c src/cattelib.cpp -o "$avr/cattelib-wider.o"
          clang++ -target avr -mmcu=atmega328p -ffreestanding -std=c++11 -pedantic-errors -Os -Iinclude "-I$avr" -c src/catrllib.cpp -o "$avr/catrllib-wider.o"
          clang++ -target avr -mmcu=atmega328p -ffreestanding -std=c++11 -pedantic-errors -Os -Iinclude "-I$avr" -c src/catoolib.cpp -o "$avr/catoolib-wider.o"
          file "$avr/cattelib-fallback.o" "$avr/cattelib-wider.o" "$avr/catrllib-fallback.o" "$avr/catrllib-wider.o" "$avr/catoolib-fallback.o" "$avr/catoolib-wider.o"
